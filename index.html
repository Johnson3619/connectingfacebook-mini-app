<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connecting Facebook</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #87CEEB;
      color: #222;
      text-align: center;
    }
    .container {
      max-width: 500px;
      margin: 0 auto;
      padding: 60px 25px;
    }
    .logo {
      width: 80px;
      height: 80px;
      margin: 0 auto 20px;
      border-radius: 20px;
      background: #1877f2;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 42px;
      font-weight: bold;
    }
    h1 {
      margin-bottom: 10px;
    }
    p {
      color: #333;
      line-height: 1.6;
    }
    button {
      margin-top: 25px;
      padding: 15px 30px;
      border: none;
      border-radius: 10px;
      background: #1877f2;
      color: white;
      font-size: 17px;
      cursor: pointer;
    }
    button:active {
      transform: scale(0.98);
    }
    button:hover {
      opacity: 0.9;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">f</div>
    <h1>Connecting Facebook</h1>
    <p>
      Welcome to your Telegram Mini App.
      Tap the button below to continue.
    </p>
    <button id="continueButton" type="button">
      Continue
    </button>
    <p id="message"></p>
  </div>
  <script>
    document.getElementById("continueButton").addEventListener("click", function () {
      window.location.href = "https://www.facebook.com/";
    });
  </script>
</body>
</html>
